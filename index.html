<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1v1lol</title>
    <style>
      :root {
        --bg: #05070d;
        --panel: rgba(18, 22, 34, 0.9);
        --text: #eef4ff;
        --muted: #a7b6d5;
        --accent: #7aa2ff;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      iframe {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        border: 0;
        display: block;
        background: #000;
        z-index: 1;
      }

      .loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: radial-gradient(circle at top, rgba(122, 162, 255, 0.14), transparent 35%), #05070d;
        z-index: 2;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      .loading.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .spinner {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.12);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .loading p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .direct-link {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 3;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(13, 17, 26, 0.8);
        border: 1px solid rgba(255,255,255,0.08);
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <iframe
      src="https://smiledemic.github.io/1v1lol/externalBuild/"
      title="1v1lol"
      allowfullscreen
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade"
      onload="document.querySelector('.loading').classList.add('hidden')"
    ></iframe>

    <div class="loading" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Loading 1v1lol</h1>
      <p>Preparing the game…</p>
    </div>

    <a class="direct-link" href="https://smiledemic.github.io/1v1lol/externalBuild/" target="_blank" rel="noopener noreferrer">Open game directly</a>
  </body>
</html>
