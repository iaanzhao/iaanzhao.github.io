<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1v1lol</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      iframe {
        width: 100vw;
        height: 100vh;
        border: 0;
        display: block;
        background: #000;
      }
      .fallback {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #0b0d13;
        color: #fff;
        text-align: center;
        padding: 24px;
      }
      .fallback.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <iframe
      src="https://smiledemic.github.io/1v1lol/externalBuild/"
      title="1v1lol"
      allowfullscreen
      loading="eager"
    ></iframe>

    <div class="fallback" id="fallback">
      <div>
        <h1>1v1lol failed to load.</h1>
        <p><a href="https://smiledemic.github.io/1v1lol/externalBuild/" style="color:#8ab4ff;">Open the game directly</a></p>
      </div>
    </div>

    <script>
      const iframe = document.querySelector('iframe');
      const fallback = document.getElementById('fallback');
      setTimeout(() => {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          if (!doc || !doc.body) {
            fallback.classList.add('visible');
          }
        } catch (e) {
          fallback.classList.add('visible');
        }
      }, 4000);
    </script>
  </body>
</html>
